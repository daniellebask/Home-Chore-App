<style>
/* VOICE everyday and encouraging: big targets, few words, quick wins first
   IDEA the house at dusk: each chore you finish lights another window
   PICTURE a dusk sky band with your house silhouette, windows lit by today's progress
   COLOUR indigo night, plum, rose, apricot, gold for wins; Danielle rose, Tyler dusk blue
   TYPE Outfit + Inter
   LAYOUT one column up to 760px: sky band, sticky person switch + tabs, list; same on phone */
:root{color-scheme:light dark;
--bg:light-dark(#fff8f4,#17142b);--ink:light-dark(#2a2140,#f3ecf6);--mut:light-dark(#6e6280,#b3a8c4);
--line:light-dark(#eadfe4,#2f2a4a);--soft:light-dark(#f7ecec,#221e3b);--card:light-dark(#ffffff,#1e1a36);
--night:#2b2350;--plum:#5b3a6e;--rose:#d9738a;--apricot:#f4a76b;--gold:#ffc96b;
--warn:light-dark(#c4622d,#f4a76b);
--pd:light-dark(#c4506f,#f190a8);--pt:light-dark(#4d6fc4,#93adf0);--pe:light-dark(#8a7c99,#a99bbb)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{font-family:Outfit,Inter,sans-serif;margin:0;letter-spacing:-.02em;line-height:1.1}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hide{display:none!important}
header{position:relative;color:#fff;background:var(--night);overflow:hidden}
.sky{position:absolute;inset:0;width:100%;height:100%}
.hd{position:relative;padding-top:max(18px,env(safe-area-inset-top,0px));padding-bottom:86px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:clamp(30px,7vw,40px);font-weight:700}
.sub{margin-top:6px;font-size:15px;color:#efe3f3}
.sub b{color:#fff}
.mebtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:0 14px;min-height:44px;display:flex;align-items:center;gap:8px;color:#fff;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.d-danielle{background:var(--pd)}.d-tyler{background:var(--pt)}.d-either,.d-both{background:var(--pe)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.lens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;padding-top:12px}
.lens button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.lens button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:12px 6px;flex:none;min-height:48px;font-weight:600;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--rose)}
main{padding-bottom:120px}
.bar0{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mut);min-height:44px}
.tog input{width:20px;height:20px;accent-color:var(--rose)}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:20px;font-weight:600}
.sec small{color:var(--mut);font-size:14px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px 10px 10px;margin-bottom:8px;transition:opacity .25s,transform .25s}
.card.over{border-left:4px solid var(--warn)}
.card.leaving{opacity:0;transform:translateX(24px)}
.chk{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--soft);display:grid;place-items:center;padding:0}
.chk svg{width:24px;height:24px;stroke:var(--mut);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.chk:hover,.chk:focus-visible{border-color:var(--gold)}
.chk.ok{background:var(--gold);border-color:var(--gold);transform:scale(1.12);transition:transform .2s}
.chk.ok svg{stroke:#2a2140}
.chk:disabled{opacity:.4}
.cb{flex:1;text-align:left;background:none;border:0;padding:2px 0}
.nm{font-weight:600;line-height:1.3}
.meta{font-size:14px;color:var(--mut);display:flex;flex-wrap:wrap;gap:2px 12px;margin-top:3px}
.due{font-weight:600;color:var(--ink);white-space:nowrap}
.over .due{color:var(--warn)}
.who,.mins{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.last{font-size:13px;color:var(--mut);margin-top:2px}
.one{width:100%;min-height:56px;border:0;border-radius:16px;background:linear-gradient(90deg,var(--plum),var(--rose));color:#fff;font:600 18px Outfit,sans-serif;margin-top:16px}
.goalmini{display:grid;gap:8px;margin-top:16px}
.gm{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.gm .row{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.gm .row b{white-space:nowrap}
.track{height:10px;border-radius:6px;background:var(--soft);margin-top:8px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--rose),var(--apricot),var(--gold))}
.empty{text-align:center;padding:36px 16px;color:var(--mut)}
.empty h3{font-size:22px;color:var(--ink);margin:10px 0 6px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.day.now{background:var(--plum);border-color:var(--plum);color:#fff}
.day b{display:block;font:700 22px/1.1 Outfit,sans-serif}
.day span{font-size:13px;opacity:.85}
.arow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.arow .cb{min-width:180px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:var(--card);padding:0 12px;min-height:40px;font-size:14px;font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true][data-o=danielle]{background:var(--pd);color:#fff}
.seg button[aria-pressed=true][data-o=tyler]{background:var(--pt);color:#fff}
.seg button[aria-pressed=true][data-o=either],.seg button[aria-pressed=true]:not([data-o]){background:var(--ink);color:var(--bg)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:44px;padding:0 16px;font-weight:600}
.btn.pri{background:var(--plum);border-color:var(--plum);color:#fff}
.btn.big{min-height:52px;font-size:17px;width:100%}
.btn.ghost{background:none}
.btn.danger{color:var(--warn);background:none;border-color:transparent}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:6;background:var(--gold);color:#2a2140;border:0;border-radius:999px;padding:0 22px;height:56px;font:700 17px Outfit,sans-serif;box-shadow:0 6px 18px rgba(43,35,80,.35)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.box h4{font-size:16px;font-weight:600;margin-bottom:8px}
.pr{display:grid;grid-template-columns:5.5em minmax(0,1fr) 2.5em;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.pr .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.pb{height:12px;border-radius:6px}
.big2{font:700 34px/1 Outfit,sans-serif}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.hist .when{color:var(--mut);font-size:13px;white-space:nowrap;width:5.2em;flex:none}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--mut);white-space:nowrap}
#ov{position:fixed;inset:0;z-index:20;background:rgba(23,20,43,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow-y:auto;border-radius:22px 22px 0 0;padding:22px max(18px,env(safe-area-inset-left,0px)) max(22px,env(safe-area-inset-bottom,0px))}
@media(min-width:620px){#ov{align-items:center}#sheet{border-radius:22px}}
#sheet h3{font-size:26px;margin-bottom:6px}
.acts{display:grid;gap:8px;margin:16px 0}
.snz{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
.snz span{font-size:14px;color:var(--mut);margin-right:4px}
.snz button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:40px;font-size:14px}
.notes{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:15px;margin-top:10px}
form label,.lbl{display:block;font-size:14px;font-weight:600;margin:14px 0 6px}
form input,form select,form textarea{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:46px}
form input[type=checkbox]{width:auto;min-height:0}
.r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{border:1px solid var(--line);background:var(--card);border-radius:10px;min-width:44px;min-height:40px;font-size:14px;padding:0 8px}
.pills button[aria-pressed=true]{background:var(--plum);border-color:var(--plum);color:#fff}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.err{color:var(--warn);font-size:14px;min-height:1em}
.fbtn{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
#toast{position:fixed;left:50%;width:max-content;bottom:max(88px,calc(env(safe-area-inset-bottom,0px) + 80px));transform:translateX(-50%);z-index:30;background:var(--night);color:#fff;border-radius:14px;padding:10px 12px 10px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);font-weight:500}
#toast button{background:none;border:0;color:var(--gold);font-weight:700;min-height:40px;padding:0 8px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.gate{min-height:100%;display:flex;flex-direction:column}
.gate header{flex:1;display:flex;align-items:flex-end;min-height:320px}
.gate .hd{padding-bottom:110px}
.gatebox{padding:24px 0 40px}
.gatebox p{color:var(--mut);margin:0 0 14px}
.focus{text-align:center;padding:10px 0}
.focus .nm{font:700 30px/1.15 Outfit,sans-serif;margin:12px 0}
.status{background:var(--soft);border-radius:12px;padding:10px 14px;margin-top:14px;font-size:14px}
@media(max-width:480px){.r2{grid-template-columns:minmax(0,1fr)}}
@media(max-width:420px){.tabs{gap:4px}.tab{font-size:15px;padding:12px 4px}}
@media(prefers-reduced-motion:reduce){.card,.chk{transition:none}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc, query, where, orderBy, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ---------- constants & helpers ---------- */
const P = {danielle:"Danielle", tyler:"Tyler"};
const OWN = {danielle:"Danielle", tyler:"Tyler", either:"Shared"};
const AREAS = ["Kitchen","Cleaning","Laundry","Pets","Errands","Yard & garden","Home maintenance"];
const W = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MINS = [5,10,15,20,30,45,60,90,120,240];
const CHEERS = ["Done and dusted.","Look at you go.","One less thing on your mind.","That's a win.","Future you says thanks.","Nailed it.","Small step, real progress.","Another window lit."];
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const DAY = 864e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const pad = n => String(n).padStart(2,"0");
const ymd = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
const toIdx = s => { const [y,m,d] = String(s).split("-").map(Number); return Math.round(Date.UTC(y,m-1,d)/DAY); };
const fromIdx = i => { const t = new Date(i*DAY); return {y:t.getUTCFullYear(), m:t.getUTCMonth()+1, d:t.getUTCDate(), wd:t.getUTCDay()}; };
const idxStr = i => { const f = fromIdx(i); return ymd(f.y,f.m,f.d); };
const todayIdx = () => { const n = new Date(); return Math.round(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())/DAY); };
const dim = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const wk = i => Math.floor((i+4)/7);
const ord = n => n + (n%100>=11&&n%100<=13 ? "th" : ({1:"st",2:"nd",3:"rd"}[n%10] || "th"));
const plural = (n,w) => `${n} ${w}${n===1?"":"s"}`;

/* ---------- scheduling (fixed days) ---------- */
function occ(c, i, si){
  if (i < si) return false;
  const s = c.sched || {}, e = Math.max(1, s.every|0 || 1), t = fromIdx(i);
  if (Array.isArray(c.season) && c.season.length && !c.season.includes(t.m)) return false;
  if (s.type === "daily") return (i - si) % e === 0;
  if (s.type === "weekly") return (s.days||[]).includes(t.wd) && (wk(i) - wk(si)) % e === 0;
  if (s.type === "monthly"){ const st = fromIdx(si); return t.d === Math.min(s.dom||1, dim(t.y,t.m)) && ((t.y*12+t.m) - (st.y*12+st.m)) % e === 0; }
  if (s.type === "yearly"){ const st = fromIdx(si); return t.m === (s.month||1) && t.d === Math.min(s.dom||1, dim(t.y,t.m)) && (t.y - st.y) % e === 0; }
  return false;
}
function nextDue(c){
  const si = c.start ? toIdx(c.start) : todayIdx();
  const from = c.lastHandled ? Math.max(toIdx(c.lastHandled)+1, si) : si;
  for (let i = from; i < from + 1500; i++) if (occ(c,i,si)) {
    let d = i;
    if (c.snooze){ const z = toIdx(c.snooze); if (z > d) d = z; }
    return d;
  }
  return null;
}
function occursOn(x, day){
  if (x.due == null) return false;
  if (day === x.due) return true;
  return day > x.due && occ(x.c, day, x.c.start ? toIdx(x.c.start) : todayIdx());
}
function schedText(c){
  const s = c.sched || {}, e = s.every || 1; let out = "";
  if (s.type === "daily") out = e===1 ? "Every day" : `Every ${e} days`;
  else if (s.type === "weekly"){
    const d = [...(s.days||[])].sort((a,b)=>a-b).map(x=>W[x]);
    const dl = d.length===7 ? "day" : d.length>2 ? d.slice(0,-1).join(", ")+" & "+d.at(-1) : d.join(" & ");
    out = e===1 ? `Every ${dl}` : `Every ${e} weeks on ${dl}`;
  } else if (s.type === "monthly"){
    const dd = (s.dom||1) >= 31 ? "last day" : ord(s.dom||1);
    out = e===1 ? `Monthly on the ${dd}` : `Every ${e} months on the ${dd}`;
  } else if (s.type === "yearly"){
    out = (e===1 ? "Yearly" : `Every ${e} years`) + ` on ${MN[(s.month||1)-1]} ${s.dom||1}`;
  }
  if (Array.isArray(c.season) && c.season.length && c.season.length < 12){
    const ms = [...c.season].sort((a,b)=>a-b);
    const run = ms.every((m,k)=>k===0||m===ms[k-1]+1);
    out += " · " + (run && ms.length>2 ? `${MN[ms[0]-1]}–${MN[ms.at(-1)-1]}` : ms.map(m=>MN[m-1]).join(", "));
  }
  return out;
}
function dueLabel(due, t){
  if (due == null) return "Not scheduled";
  const n = due - t;
  if (n < 0) return n === -1 ? "Since yesterday" : `${-n} days late`;
  if (n === 0) return "Today";
  if (n === 1) return "Tomorrow";
  const f = fromIdx(due);
  if (n < 7) return W[f.wd];
  return `${MN[f.m-1]} ${f.d}` + (f.y !== fromIdx(t).y ? `, ${f.y}` : "");
}
function relDate(i, t){
  if (i === t) return "today"; if (i === t-1) return "yesterday";
  const f = fromIdx(i); return `${MN[f.m-1]} ${f.d}`;

/* ---------- sky picture ---------- */
function skySvg(lit, total){
  const wins = [[496,150],[524,150],[496,176],[524,176],[662,160],[690,160],[662,186],[690,186]];
  const n = total ? Math.round(wins.length * lit / total) : 0;
  let sd = 7; const rnd = () => (sd = sd*16807 % 2147483647) / 2147483647;
  const stars = Array.from({length:46}, () => `<circle cx="${(rnd()*1200).toFixed(0)}" cy="${(rnd()*110).toFixed(0)}" r="${(0.8+rnd()*1.2).toFixed(1)}" fill="#fff" opacity="${(0.4+rnd()*0.5).toFixed(2)}"/>`).join("");
  return `<rect width="1200" height="220" fill="url(#skyg)"/>${stars}
  <circle cx="600" cy="205" r="52" fill="url(#sung)" opacity=".95"/>
  <path d="M0 192 Q300 168 600 190 T1200 180 V220 H0Z" fill="#43285a"/>
  <path d="M0 206 Q250 196 520 208 T1200 204 V220 H0Z" fill="#33224b"/>
  <path d="M470 220 V140 L510 108 L550 140 V220Z" fill="#241c3e"/><rect x="532" y="112" width="10" height="20" fill="#241c3e"/>
  <path d="M636 220 V150 L676 118 L716 150 V220Z" fill="#241c3e"/>
  <path d="M550 220 V160 H636 V220Z" fill="#2a2147"/>
  ${wins.map(([x,y],k)=>`<rect x="${x}" y="${y}" width="16" height="14" rx="2" fill="${k<n?"#ffc96b":"#3a2f5c"}"/>`).join("")}
  <rect x="585" y="186" width="16" height="34" rx="2" fill="${n===wins.length?"#ffc96b":"#3a2f5c"}"/>`;
}

/* ---------- render ---------- */
function card(x, t){
  const {id, c, due} = x, over = due != null && due < t;
  const o = c.owner || "either";
  return `<div class="card${over?" over":""}" data-card="${esc(id)}">
    <button class="chk" type="button" data-done="${esc(id)}" aria-label="Mark ${esc(c.name)} done">${CHECK}</button>
    <button class="cb" type="button" data-open="${esc(id)}">
      <div class="nm">${esc(c.name)}</div>
      <div class="meta"><span class="due">${esc(dueLabel(due,t))}</span>${c.mins?`<span class="mins">${esc(minsLabel(c.mins))}</span>`:""}<span class="who"><span class="dot d-${o}"></span>${esc(OWN[o]||"Shared")}</span></div>
      ${c.lastDone?`<div class="last">Last done ${esc(relDate(toIdx(c.lastDone),t))}${c.lastBy?" by "+esc(P[c.lastBy]||"someone"):""}</div>`:""}
    </button></div>`;
}
function goalWin(g, t){
  if (g.period === "week"){ const s = t - fromIdx(t).wd; return [s, s+6]; }
  if (g.period === "month"){ const f = fromIdx(t), s = toIdx(ymd(f.y,f.m,1)); return [s, s+dim(f.y,f.m)-1]; }
  return [toIdx(g.start), toIdx(g.end)];
}
function goalCount(g, t){
  const [a,b] = goalWin(g,t);
  return log.filter(l => l.action === "done" && (g.who === "both" || l.by === g.who) && (!g.choreId || l.choreId === g.choreId) && (()=>{const i = toIdx(l.date); return i>=a && i<=b;})()).length;
}
const goalVisible = g => lens === "both" || g.who === lens || g.who === "both";
const activeGoal = (g,t) => g.period !== "custom" || toIdx(g.end) >= t;
function goalCard(id, g, t, full){
  const n = goalCount(g,t), pct = Math.min(100, Math.round(100*n/Math.max(1,g.target)));
  const [a,b] = goalWin(g,t);
  const when = g.period === "week" ? "this week" : g.period === "month" ? "this month" : `by ${relDate(b,t)}`;
  const who = g.who === "both" ? "Together" : P[g.who];
  const done = n >= g.target;
  return `<button type="button" class="gm" data-goal="${esc(id)}" style="text-align:left;width:100%;cursor:pointer">
    <div class="row"><span>${esc(g.title)}</span><b>${n} / ${g.target}</b></div>
    <div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <div class="meta" style="margin-top:6px"><span><span class="dot d-${g.who}"></span> ${esc(who)}</span><span>${esc(when)}</span>${done?'<span class="due">Goal reached</span>':""}${full&&g.reward?`<span>Reward: ${esc(g.reward)}</span>`:""}</div></button>`;
}
function streak(person, t){
  const days = new Set(log.filter(l => l.action === "done" && (person === "both" || l.by === person)).map(l => toIdx(l.date)));
  let i = days.has(t) ? t : t-1, n = 0;
  while (days.has(i)) { n++; i--; }
  return n;
}

function render(){
  if (!user) return;

    ? `<b>${doneToday}</b> done today · <b>${dueNow.length}</b> to go${st>1?` · ${st}-day streak`:""}`

  const m = $("#main");
  if (denied){ m.innerHTML = `<div class="empty"><h3>This account isn't on the list</h3><p>You're signed in as ${esc(user.email)}. Ask Danielle to add this email to the Firebase rules, or sign out and use the right account.</p><button class="btn" type="button" data-act="signout">Sign out</button></div>`; return; }
  if (!got){ m.innerHTML = `<div class="empty"><p>Loading your chores…</p></div>`; return; }
  const shareTog = lens !== "both" ? `<label class="tog"><input type="checkbox" id="shtog" ${showShared?"checked":""}> Include shared chores</label>` : `<span></span>`;
  let h = "";
  if (tab === "today"){
    const gs = [...goals].filter(([,g]) => goalVisible(g) && activeGoal(g,t));
    const over = xs.filter(x => x.due != null && x.due < t).sort(byMins);
    const tod = xs.filter(x => x.due === t).sort(byMins);
    const soon = xs.filter(x => x.due != null && x.due > t && x.due <= t+3).sort(byDueMins);
    h += `<div class="bar0">${shareTog}</div>`;
    if (gs.length) h += `<div class="goalmini">${gs.slice(0,3).map(([id,g]) => goalCard(id,g,t,false)).join("")}</div>`;
    if (over.length + tod.length) h += `<button class="one" type="button" data-act="one">Just pick one for me</button>`;
    if (!chores.size) h += starterBlock();
    else if (!over.length && !tod.length) h += `<div class="empty">${starSvg()}<h3>All clear for today</h3><p>Every window's lit. Go enjoy your evening.</p></div>`;
    if (tod.length) h += `<div class="sec"><h2>Today</h2><small>quickest first</small></div>` + tod.map(x => card(x,t)).join("");
    if (over.length) h += `<div class="sec"><h2>Catch up when you can</h2><small>${over.length}</small></div>` + over.map(x => card(x,t)).join("");
    if (soon.length) h += `<div class="sec"><h2>Next few days</h2></div>` + soon.map(x => card(x,t)).join("");
  }
  else if (tab === "upcoming"){
    h += `<div class="bar0">${shareTog}</div><div class="week">` + Array.from({length:7},(_,k)=>{
      const day = t+k, f = fromIdx(day);
      const n = xs.filter(x => occursOn(x,day) || (k===0 && x.due != null && x.due < t)).length;
      return `<div class="day${k===0?" now":""}"><span>${k===0?"Today":W[f.wd]}</span><b>${n}</b><span>${f.d}</span></div>`;
    }).join("") + `</div>`;
    const fut = xs.filter(x => x.due != null && x.due > t).sort(byDueMins);
    let last = null;
    for (const x of fut){
      const f = fromIdx(x.due);
      const key = x.due <= t+13 ? x.due : `${f.y}-${f.m}`;
      if (key !== last){
        last = key;
        const label = x.due <= t+13 ? (x.due===t+1 ? "Tomorrow" : `${W[f.wd]}, ${MN[f.m-1]} ${f.d}`) : `${["January","February","March","April","May","June","July","August","September","October","November","December"][f.m-1]} ${f.y}`;
        h += `<div class="sec"><h2>${esc(label)}</h2></div>`;
      }
      h += card(x,t);
    }
    if (!fut.length) h += `<div class="empty"><p>Nothing scheduled ahead.</p></div>`;
  }
  else if (tab === "all"){
    h += `<div class="bar0">${shareTog}<span class="hint">Tap Danielle / Tyler / Shared to set who owns each chore.</span></div>`;
    if (!chores.size) h += starterBlock();
    const groups = [...AREAS, ...new Set([...chores.values()].map(c=>c.area).filter(a=>!AREAS.includes(a)))];
    for (const a of groups){
      const g = xs.filter(x => (x.c.area||"Cleaning") === a).sort((p,q)=>p.c.name.localeCompare(q.c.name));
      if (!g.length) continue;
      h += `<div class="sec"><h2>${esc(a)}</h2><small>${g.length}</small></div>`;
      h += g.map(x => `<div class="arow"><button class="cb" type="button" data-open="${esc(x.id)}"><div class="nm">${esc(x.c.name)}</div><div class="meta"><span>${esc(schedText(x.c))}</span><span>Next: ${esc(dueLabel(x.due,t))}</span></div></button>
        <div class="seg" role="group" aria-label="Owner">${["danielle","tyler","either"].map(o=>`<button type="button" data-own="${esc(x.id)}" data-o="${o}" aria-pressed="${(x.c.owner||"either")===o}">${OWN[o]}</button>`).join("")}</div></div>`).join("");
    }
  }
  else if (tab === "goals"){
    const gs = [...goals].filter(([,g]) => goalVisible(g)).sort((a,b)=>(b[1].created||0)-(a[1].created||0));
    h += `<div class="sec"><h2>Goals</h2><button class="btn pri" type="button" data-act="newgoal">+ New goal</button></div>`;
    h += `<p class="hint" style="margin:0 0 12px">Pick a number to hit, like "vacuum 2 times this week" or "20 chores this month", and a reward for getting there.</p>`;
    const act = gs.filter(([,g]) => activeGoal(g,t)), old = gs.filter(([,g]) => !activeGoal(g,t));
    h += act.length ? `<div class="goalmini">${act.map(([id,g])=>goalCard(id,g,t,true)).join("")}</div>` : `<div class="empty"><p>No goals yet. Start small: 3 chores this week is a great first one.</p></div>`;
    if (old.length) h += `<div class="sec"><h2>Finished</h2></div><div class="goalmini">${old.map(([id,g])=>goalCard(id,g,t,true)).join("")}</div>`;
  }
  else if (tab === "stats"){
    const done = log.filter(l => l.action === "done");
    const ws = t - fromIdx(t).wd, f = fromIdx(t), ms = toIdx(ymd(f.y,f.m,1));
    const per = [["This week",ws],["This month",ms],["Last 90 days",t-89]];
    h += `<div class="sec"><h2>Streaks</h2><small>days in a row with a chore done</small></div><div class="stats">` +
      ["danielle","tyler"].map(p => `<div class="box"><h4><span class="dot d-${p}"></span> ${P[p]}</h4><div class="big2">${streak(p,t)}</div><div class="hint">${plural(done.filter(l=>l.by===p&&toIdx(l.date)===t).length,"chore")} today</div></div>`).join("") + `</div>`;

      const mx = Math.max(1, c.danielle, c.tyler);
      return `<div class="box"><h4>${lab}</h4>${["danielle","tyler"].map(p=>`<div class="pr"><span>${P[p]}</span><div class="pb d-${p}" style="width:${Math.max(3,100*c[p]/mx)}%"></div><span class="n">${c[p]}</span></div>`).join("")}</div>`;
    }).join("") + `</div>`;
    const ar = {}; done.filter(l => toIdx(l.date) >= t-29).forEach(l => { const a = l.area || "Other"; ar[a] = ar[a] || {danielle:0,tyler:0}; if (ar[a][l.by] != null) ar[a][l.by]++; });
    const arr = Object.entries(ar).sort((a,b)=>(b[1].danielle+b[1].tyler)-(a[1].danielle+a[1].tyler));
    const amx = Math.max(1, ...arr.map(([,v])=>v.danielle+v.tyler));

  }
  m.innerHTML = h;
  const tg = $("#shtog"); if (tg) tg.onchange = () => { showShared = tg.checked; ls.set("chores.shared", showShared ? "1" : "0"); render(); };

async function saveChore(id){
  const name = $("#f-name").value.trim(), ty = $("#f-type").value;
  const every = Math.min(24, Math.max(1, parseInt($("#f-every").value) || 1));
  const days = [...document.querySelectorAll("#f-days [aria-pressed=true]")].map(b => +b.dataset.d);
  const season = [...document.querySelectorAll("#f-season [aria-pressed=true]")].map(b => +b.dataset.m);
  const dom = Math.min(31, Math.max(1, parseInt($("#f-dom").value) || 1));
  const start = $("#f-start").value || idxStr(todayIdx());
  if (!name) return $("#f-err").textContent = "Give the chore a name.";
  if (ty === "weekly" && !days.length) return $("#f-err").textContent = "Pick at least one day.";
  const sched = {type:ty, every};
  if (ty === "weekly") sched.days = days;
  if (ty === "monthly" || ty === "yearly") sched.dom = dom;
  if (ty === "yearly") sched.month = +$("#f-month").value;
  const owner = document.querySelector("#f-owner [aria-pressed=true]")?.dataset.o || "either";
  const base = id ? {...chores.get(id)} : {created: Date.now(), lastHandled:null, lastDone:null, lastBy:null, snooze:null};
  const data = {...base, name, area: $("#f-area").value, mins: +$("#f-mins").value, owner, sched, start, season: season.length === 12 ? [] : season, notes: $("#f-notes").value.trim()};
  const ref = id ? doc(fs,"chores",id) : doc(collection(fs,"chores"));
  closeSheet();
  enqueue(ref.id, () => setDoc(ref, data)).catch(fail);
  toast(id ? "Chore updated." : "Chore added.");
}

/* ---------- actions ---------- */
function fail(e){
  console.error(e);
  toast(e?.code === "permission-denied" ? "Not allowed: this account isn't on the list." : "Couldn't save. It'll retry when you're back online.");
}
function markDone(id, by, action = "done", fromEl = null){
  const c = chores.get(id); if (!c || !by) return;
  const t = todayIdx(), due = nextDue(c);
  const dueBefore = items().filter(x => x.due != null && x.due <= t);
  const wasDue = dueBefore.some(x => x.id === id);
  const goalHits = action === "done" ? [...goals.values()].filter(g => activeGoal(g,t) && (g.who === "both" || g.who === by) && (!g.choreId || g.choreId === id) && (()=>{const [a,b] = goalWin(g,t); return t>=a && t<=b;})() && goalCount(g,t) + 1 === g.target) : [];
  const prev = {lastHandled: c.lastHandled ?? null, lastDone: c.lastDone ?? null, lastBy: c.lastBy ?? null, snooze: c.snooze ?? null};
  const lh = idxStr(Math.max(t, due ?? t));
  const patch = action === "done" ? {lastHandled: lh, lastDone: idxStr(t), lastBy: by, snooze: null} : {lastHandled: lh, snooze: null};
  const cref = doc(fs,"chores",id), lref = doc(collection(fs,"log"));
  enqueue(id, () => updateDoc(cref, patch)).catch(fail);
  enqueue(lref.id, () => setDoc(lref, {choreId:id, name:c.name, area:c.area||"", by, action, date: idxStr(t), ts: Date.now(), mins: c.mins||0})).catch(fail);
  const undo = () => { enqueue(id, () => updateDoc(cref, prev)).catch(fail); enqueue(lref.id, () => deleteDoc(lref)).catch(fail); };
  if (action === "skip") return toast("Skipped. No guilt.", undo);
  const by2 = by !== me ? `${P[by]} gets the credit. ` : "";
  if (goalHits.length){
    celebrate(fromEl, 3);
    const g = goalHits[0];
    toast(`Goal reached: ${g.title}!${g.reward ? " Reward: " + g.reward : ""}`, undo, 9000);
  } else if (wasDue && dueBefore.length === 1){
    celebrate(fromEl, 2);
    toast("Today's list is clear. Every window's lit!", undo, 8000);
  } else {
    celebrate(fromEl, 1);
    toast(by2 + CHEERS[Math.floor(Math.random()*CHEERS.length)], undo);
  }
}
function snooze(id, n){
  const c = chores.get(id); if (!c) return;
  const t = todayIdx(), due = nextDue(c), until = idxStr(Math.max(t, due ?? t) + n);
  const prev = c.snooze ?? null;
  enqueue(id, () => updateDoc(doc(fs,"chores",id), {snooze: until})).catch(fail);
  closeSheet();
  toast(`Snoozed until ${dueLabel(toIdx(until), t).replace("Tomorrow","tomorrow")}.`, () => enqueue(id, () => updateDoc(doc(fs,"chores",id), {snooze: prev})).catch(fail));
}
async function seed(){
  const t = todayIdx(), f = fromIdx(t);
  const b = writeBatch(fs);
  STARTER.forEach((s, k) => {
    let start = idxStr(t);
    if (s.startMonth){ const y = s.startMonth >= f.m ? f.y : f.y+1; start = ymd(y, s.startMonth, 1); }
    if (s.startYear) start = ymd(f.y + s.startYear, 1, 1);
    const {startMonth, startYear, ...rest} = s;
    b.set(doc(fs,"chores",`starter-${pad(k+1)}`), {owner:"either", season:[], notes:"", ...rest, start, created: Date.now()+k, lastHandled:null, lastDone:null, lastBy:null, snooze:null});
  });
  toast("Adding your starter chores…");
  try { await b.commit(); toast("Starter chores added. Now pick owners in All chores."); tab = "all"; ls.set("chores.tab","all"); render(); }
  catch(e){ fail(e); }
}

/* ---------- toast & confetti ---------- */
let toastTimer = null;
function toast(msg, undo, ms = 6000){
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${undo?'<button type="button">Undo</button>':""}`;
  el.classList.remove("hide");
  if (undo) el.querySelector("button").onclick = () => { undo(); el.classList.add("hide"); toast("Undone."); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.add("hide"), ms);
}
const reduce = matchMedia("(prefers-reduced-motion: reduce)");
function celebrate(fromEl, level){
  try { navigator.vibrate?.(level > 1 ? [30,60,30,60,60] : 30); } catch(e){}
  if (reduce.matches) return;
  const cv = $("#fx"), ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  cv.classList.remove("hide");
  const Wd = innerWidth, Ht = innerHeight;
  cv.width = Wd*dpr; cv.height = Ht*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const r = fromEl?.getBoundingClientRect?.();
  const ox = r ? r.left + r.width/2 : Wd/2, oy = r ? r.top + r.height/2 : Ht/2;
  const cols = ["#ffc96b","#f4a76b","#d9738a","#9b6b9e","#93adf0","#fff1c9"];
  const N = level === 1 ? 70 : level === 2 ? 160 : 240;
  const ps = Array.from({length:N}, () => {
    const a = level === 1 ? -Math.PI/2 + (Math.random()-.5)*2.2 : Math.random()*Math.PI*2;
    const v = (level === 1 ? 5 : 8) * (0.5 + Math.random());
    const sx = level === 1 ? ox : Wd*Math.random(), sy = level === 1 ? oy : Ht*0.35*Math.random();
    return {x:sx, y:sy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - (level>1?2:0), s:4+Math.random()*5, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:cols[Math.floor(Math.random()*cols.length)], star:Math.random()<.3};
  });
  const T = level === 1 ? 1300 : 2400, t0 = performance.now();
  const step = now => {
    const k = (now - t0) / T;
    ctx.clearRect(0,0,Wd,Ht);
    for (const p of ps){
      p.vy += 0.22; p.vx *= 0.99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k*k); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.star){ ctx.beginPath(); for (let j=0;j<10;j++){ const rr = j%2 ? p.s*.45 : p.s; const aa = j*Math.PI/5; ctx.lineTo(Math.cos(aa)*rr, Math.sin(aa)*rr); } ctx.fill(); }
      else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      ctx.restore();
    }
    if (k < 1) requestAnimationFrame(step); else { ctx.clearRect(0,0,Wd,Ht); cv.classList.add("hide"); }
  };
  requestAnimationFrame(step);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.lens){ lens = d.lens; ls.set("chores.lens", lens); render(); return; }
  if (d.tab){ tab = d.tab; ls.set("chores.tab", tab); render(); scrollTo({top:0}); return; }
  if (d.done){
    if (!me) return openMe();
    b.classList.add("ok"); b.disabled = true;
    const cardEl = b.closest(".card");
    setTimeout(() => { cardEl?.classList.add("leaving"); }, reduce.matches ? 0 : 180);
    markDone(d.done, me, "done", b);
    return;
  }
  if (d.open) return openChore(d.open);
  if (d.own){ const id = d.own, c = chores.get(id); if (c && c.owner !== d.o) enqueue(id, () => updateDoc(doc(fs,"chores",id), {owner: d.o})).catch(fail); b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  if (d.goal) return goalForm(d.goal);
  if (d.me) return setMe(d.me);
  if (d.snz && sheetCtx) return snooze(sheetCtx.id, +d.snz);
  if (b.closest("#f-days,#f-season")){ b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") !== "true"); return; }
  if (b.closest("#f-owner,#g-who")){ b.parentElement.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); return; }
  const a = d.act; if (!a) return;
  const ctx = sheetCtx;
  if (a === "close") return closeSheet();
  if (a === "signout"){ closeSheet(); return signOut(auth); }
  if (a === "seed"){ b.disabled = true; return seed(); }
  if (a === "one") return openFocus([]);
  if (a === "newgoal") return goalForm(null);
  if (a === "edit") return choreForm(ctx.id);
  if (a === "done" || a === "doneother" || a === "skip"){
    const who = me || "danielle";
    closeSheet();
    return markDone(ctx.id, a === "doneother" ? otherOf(who) : who, a === "skip" ? "skip" : "done", null);
  }
  if (a === "fdone"){ if (!me) return openMe(); const id = ctx.id; markDone(id, me, "done", b); return openFocus([...ctx.skip, id]); }
  if (a === "fnext") return openFocus([...ctx.skip, ctx.id]);
  if (a === "del"){
    if (b.dataset.sure){ const id = ctx.id; closeSheet(); enqueue(id, () => deleteDoc(doc(fs,"chores",id))).catch(fail); return toast("Chore deleted."); }
    b.dataset.sure = "1"; b.textContent = "Tap again to delete for good"; return;
  }
  if (a === "delgoal"){
    if (b.dataset.sure){ const id = ctx.id; closeSheet(); enqueue(id, () => deleteDoc(doc(fs,"goals",id))).catch(fail); return toast("Goal deleted."); }
    b.dataset.sure = "1"; b.textContent = "Tap again to delete"; return;
  }
});

function niceAuth(e){
  const m = {"auth/invalid-credential":"That email and password don't match.","auth/wrong-password":"That password isn't right.","auth/user-not-found":"No account with that email yet. Tap Create account.","auth/email-already-in-use":"That email already has an account. Tap Sign in.","auth/weak-password":"Use at least 6 characters.","auth/invalid-email":"That email doesn't look right.","auth/unauthorized-domain":"This web address isn't approved in Firebase yet (Authentication → Settings → Authorized domains).","auth/operation-not-allowed":"That sign-in method isn't turned on in Firebase yet."};
  return m[e.code] || `Sign-in didn't work (${e.code || e.message}).`;
}

/* ---------- boot ---------- */
let unsubs = [];
function startData(){
  unsubs.forEach(u => u()); unsubs = [];
  got = false; denied = false;
  const onErr = e => { console.error(e); if (e.code === "permission-denied"){ denied = true; got = true; } else toast("Can't reach your chore list right now."); render(); };
  const slow = setTimeout(() => { if (!got) toast("Still loading. Check your connection."); }, 10000);
  unsubs.push(onSnapshot(collection(fs,"chores"), s => { chores = new Map(s.docs.map(d => [d.id, d.data()])); got = true; clearTimeout(slow); render(); }, onErr));
  const since = Date.now() - 120*DAY;
  unsubs.push(onSnapshot(query(collection(fs,"log"), where("ts",">=",since), orderBy("ts","desc")), s => { log = s.docs.map(d => ({id:d.id, ...d.data()})); render(); }, onErr));
  unsubs.push(onSnapshot(collection(fs,"goals"), s => { goals = new Map(s.docs.map(d => [d.id, d.data()])); render(); }, onErr));
  unsubs.push(onSnapshot(doc(fs,"settings","people"), s => {
    people = s.exists() ? s.data() : {};
    if (!me && user?.email){ const hit = Object.keys(P).find(p => people[p] === user.email); if (hit){ me = hit; ls.set("chores.me", hit); if (!ls.get("chores.lens")) lens = hit; } }
    render();
  }, () => {}));
}

const cfg = window.FIREBASE_CONFIG || {};
if (!cfg.apiKey || !cfg.projectId){
  gate(`<h3 style="font-size:22px;margin-bottom:8px">Almost there</h3><p>This page needs your Firebase settings. Open <b>index.html</b>, find <b>FIREBASE_CONFIG</b> near the top, and paste in the values from your Firebase project. The SETUP guide walks you through it.</p>`);
} else {
  const app = initializeApp(cfg);
  auth = getAuth(app);
  try { fs = initializeFirestore(app, {localCache: persistentLocalCache({tabManager: persistentMultipleTabManager()})}); }
  catch(e){ fs = initializeFirestore(app, {}); }
  getRedirectResult(auth).catch(e => showSignIn(niceAuth(e)));
  onAuthStateChanged(auth, u => {
    user = u;
    if (!u){ unsubs.forEach(x => x()); unsubs = []; showSignIn(); return; }
    $("#gate").classList.add("hide"); $("#app").classList.remove("hide");
    render();
    startData();
    if (!me) setTimeout(() => { if (!me) openMe(); }, 1500);
  });
}
</script>
</body>
</html>
